name: Build Desktop Tools

# Builds the native host binaries that app/ needs to convert video -> .z64
# without Docker or a local N64_INST toolchain installed on the end user's
# machine: mkdfs, n64tool, videoconv64, audioconv64, ed64romconfig.
#
# None of these 5 tools depend on the MIPS N64_INST toolchain
# (DECOMP_STUBS/n64elfcompress do; these don't), so each job builds them with
# a plain host C/C++ toolchain — no libdragon toolchain image, no MIPS
# cross-compiler. See app/resources/tools/<platform>/MANIFEST.md for the
# per-platform detail and the equivalent commands to run by hand.
#
# The player .elf (resources/rom-assets/) is a separate build, with the full
# MIPS toolchain via Docker: no job here generates it.
#
# Each job uploads its own artifact; download it and replace the matching
# app/resources/tools/<platform>/bin/ folder to update the committed
# binaries.

on:
  workflow_dispatch:
  push:
    paths:
      - "core/libdragon"
      - ".github/workflows/build-desktop-tools.yml"

jobs:
  build-tools-windows:
    # Cross-compiled from Linux with mingw-w64: no Windows runner needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install mingw-w64 (posix threads, for std::thread)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix

      - name: Build host tools
        working-directory: core/libdragon/tools
        run: |
          CC="x86_64-w64-mingw32-gcc -static" \
          CXX="x86_64-w64-mingw32-g++ -static -static-libgcc -static-libstdc++" \
          AR="x86_64-w64-mingw32-ar" \
            make mkdfs n64tool videoconv64 audioconv64 ed64romconfig

      - name: Collect binaries
        run: |
          mkdir -p app/resources/tools/win32-x64/bin
          for tool in mkdfs n64tool videoconv64 audioconv64 ed64romconfig; do
            find core/libdragon/tools -iname "${tool}.exe" -exec cp {} app/resources/tools/win32-x64/bin/ \;
          done
          ls -la app/resources/tools/win32-x64/bin

      - name: Sanity check (native binaries, so run them via Wine on this Linux runner)
        run: |
          sudo apt-get install -y -qq --no-install-recommends wine64
          wine64 app/resources/tools/win32-x64/bin/mkdfs.exe || true
          wine64 app/resources/tools/win32-x64/bin/videoconv64.exe --help || true

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-tools-win32-x64
          path: app/resources/tools/win32-x64/bin/*.exe

  build-tools-linux:
    # Built natively, but inside an ubuntu:20.04 container (rather than
    # directly on the runner's own, newer Ubuntu) so the resulting glibc
    # dependency stays compatible with distros far newer than that without
    # rebuilding. See app/resources/tools/linux-x64/MANIFEST.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Build host tools (in ubuntu:20.04)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo/core/libdragon/tools ubuntu:20.04 bash -lc '
            set -e
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends g++ gcc make
            CXX="g++ -static-libgcc -static-libstdc++" CC="gcc" \
              make -B mkdfs n64tool videoconv64 audioconv64 ed64romconfig
          '

      - name: Collect binaries
        run: |
          mkdir -p app/resources/tools/linux-x64/bin
          cp core/libdragon/tools/mkdfs/mkdfs app/resources/tools/linux-x64/bin/mkdfs
          cp core/libdragon/tools/n64tool app/resources/tools/linux-x64/bin/n64tool
          cp core/libdragon/tools/videoconv64/videoconv64 app/resources/tools/linux-x64/bin/videoconv64
          cp core/libdragon/tools/audioconv64/audioconv64 app/resources/tools/linux-x64/bin/audioconv64
          cp core/libdragon/tools/ed64romconfig app/resources/tools/linux-x64/bin/ed64romconfig
          strip app/resources/tools/linux-x64/bin/*
          chmod +x app/resources/tools/linux-x64/bin/*
          ls -la app/resources/tools/linux-x64/bin

      - name: Sanity check (native binaries, runner is Linux x64)
        run: |
          app/resources/tools/linux-x64/bin/mkdfs || true
          app/resources/tools/linux-x64/bin/videoconv64 --help || true

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-tools-linux-x64
          path: app/resources/tools/linux-x64/bin/*

  build-tools-macos:
    # Built natively with the Xcode command-line tools already on the
    # runner. macos-15 is an Apple Silicon (arm64) runner — the architecture
    # of every Mac Apple has sold since 2020, and the one GitHub defaults
    # its hosted macOS fleet to today. Intel (x64) macOS runners are on
    # their way out on GitHub's side (they now need the separate
    # "-intel"/"-large" labels) and Apple itself stopped making Intel Macs,
    # so this targets darwin-arm64 only — see
    # app/resources/tools/darwin-arm64/MANIFEST.md.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Build host tools
        working-directory: core/libdragon/tools
        run: make mkdfs n64tool videoconv64 audioconv64 ed64romconfig

      - name: Collect binaries
        run: |
          mkdir -p app/resources/tools/darwin-arm64/bin
          cp core/libdragon/tools/mkdfs/mkdfs app/resources/tools/darwin-arm64/bin/mkdfs
          cp core/libdragon/tools/n64tool app/resources/tools/darwin-arm64/bin/n64tool
          cp core/libdragon/tools/videoconv64/videoconv64 app/resources/tools/darwin-arm64/bin/videoconv64
          cp core/libdragon/tools/audioconv64/audioconv64 app/resources/tools/darwin-arm64/bin/audioconv64
          cp core/libdragon/tools/ed64romconfig app/resources/tools/darwin-arm64/bin/ed64romconfig
          strip app/resources/tools/darwin-arm64/bin/*
          chmod +x app/resources/tools/darwin-arm64/bin/*
          ls -la app/resources/tools/darwin-arm64/bin

      - name: Sanity check (native binaries, runner is macOS arm64)
        run: |
          app/resources/tools/darwin-arm64/bin/mkdfs || true
          app/resources/tools/darwin-arm64/bin/videoconv64 --help || true

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-tools-darwin-arm64
          path: app/resources/tools/darwin-arm64/bin/*
