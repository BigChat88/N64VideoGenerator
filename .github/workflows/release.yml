name: Release Desktop App

# On every push to main, build the Electron app in app/ and publish a
# GitHub Release with the compiled, ready-to-download portable .exe attached.
#
# The app build is self-contained: it only needs app/ (the prebuilt player
# .elf and native host tools are already committed under app/resources/),
# so this workflow does NOT check out the libdragon submodule or touch the
# MIPS toolchain.

on:
  workflow_dispatch:
  push:
    branches:
      - main

# Allow the workflow to create tags and releases.
permissions:
  contents: write

# Never run two releases at once; let an in-flight one finish.
concurrency:
  group: release-desktop-app
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Read app version
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build portable app (electron-builder)
        run: npm run dist
        env:
          # electron-builder: do not auto-publish, we attach the files below.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List build output
        shell: bash
        run: ls -la release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}-build.${{ github.run_number }}
          name: N64 Video Generator v${{ steps.ver.outputs.version }} (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            app/release/*.exe
